id: policies-security-rules
title: Security Policies
category: Security & NAT
sheet: Security Rules
summary: Bulk create, update or delete security rules with zone, source/destination, application,
  service and action columns.
handler: services.policies.apply_security_rules
columns:
- Action
- Name
- Description
- From
- To
- Source
- Destination
- Users
- Applications
- Services
- Categories
- Rule Action
- Log Setting
- Disabled
examples:
- Action: create
  Name: sample--allow-web
  From: trust
  To: untrust
  Source: any
  Destination: sample-web
  Applications: web-browsing
  Services: application-default
  Rule Action: allow
